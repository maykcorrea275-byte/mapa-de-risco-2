<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Risco Interativo - Sala de Aula</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a24;
      color: #ffffff;
    }

    /* Cabeçalho */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(26, 26, 36, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .toggle-container {
      display: flex;
      background: #2b2b36;
      border-radius: 8px;
      padding: 4px;
    }

    .btn-toggle {
      background: transparent;
      border: none;
      color: #a0a0b0;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .btn-toggle.active {
      background: #007acc;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 122, 204, 0.4);
    }

    /* Áreas de Visualização */
    #main-container {
      width: 100%;
      height: calc(100% - 60px);
      margin-top: 60px;
      position: relative;
    }

    /* Modulo 2D */
    #view-2d {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-color: #f4f4f6;
    }

    .image-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
    }

    #view-2d img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    /* Pontos Interativos no 2D (Hotspots) */
    .hotspot-2d {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid #fff;
      cursor: pointer;
      animation: pulse 1.8s infinite;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .hotspot-2d.fisico { border-color: #2eb85c; box-shadow: 0 0 12px #2eb85c; }
    .hotspot-2d.ergonomico { border-color: #f9b115; box-shadow: 0 0 12px #f9b115; }
    .hotspot-2d.acidente { border-color: #3399ff; box-shadow: 0 0 12px #3399ff; }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
    }

    /* Modulo 3D */
    #view-3d {
      width: 100%;
      height: 100%;
      display: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 15px 30px;
      border-radius: 8px;
      pointer-events: none;
      display: none;
      z-index: 50;
    }

    /* Janela Pop-up / Modal Interativo */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #23232e;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      padding: 24px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      color: #aaa;
      cursor: pointer;
    }

    .close-btn:hover { color: #fff; }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #007acc;
    }

    .modal-body p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #d0d0d8;
      margin-bottom: 15px;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <header>
    <div class="title">Mapa de Risco Interativo - Sala de Aula</div>
    <div class="toggle-container">
      <button id="btn-2d" class="btn-toggle active" onclick="switchView('2d')">Visão 2D (Planta)</button>
      <button id="btn-3d" class="btn-toggle" onclick="switchView('3d')">Visão 3D Interativa</button>
    </div>
  </header>

  <div id="main-container">
    <!-- Visão 2D -->
    <div id="view-2d">
      <div class="image-wrapper">
        <img src="mapa_tradicional.png" alt="Mapa de Risco 2D">
        
        <!-- Pontos Interativos no Mapa 2D (Posicionamentos em %) -->
        <div class="hotspot-2d fisico" style="top: 22%; left: 57%;" onclick="openModal('fisico')"></div>
        <div class="hotspot-2d ergonomico" style="top: 51%; left: 37%;" onclick="openModal('ergonomico')"></div>
        <div class="hotspot-2d acidente" style="top: 74%; left: 53%;" onclick="openModal('acidente')"></div>
      </div>
    </div>

    <!-- Visão 3D -->
    <div id="view-3d"></div>
    <div id="loading">Carregando Modelo 3D...</div>
  </div>

  <!-- Modal/Pop-up para Vídeo e Detalhes -->
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modal-title" class="modal-title">Título do Risco</h3>
      <div class="modal-body">
        <p id="modal-desc">Descrição do risco...</p>
        <div class="video-container">
          <iframe id="modal-video" src="" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Dados dos Riscos (Vídeos e Detalhes)
    const riskData = {
      fisico: {
        title: "Risco Físico: Ruído dos Ventiladores",
        desc: "Ruído contínuo proveniente da falta de manutenção nos ventiladores da sala de aula. Recomendação: Manutenção periódica preventiva.",
        video: "<iframe width="560" height="315" src="https://www.youtube.com/embed/QA9uO0xu9eE?si=endZwZmteE1WcZVG" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      },
      ergonomico: {
        title: "Risco Ergonômico: Postura Inadequada",
        desc: "Postura inadequada dos alunos durante as atividades letivas. Recomendação: Orientação postural e ajuste das carteiras.",
        video: "<iframe width="560" height="315" src="https://www.youtube.com/embed/hrX5gyFkhjg?si=gZLHqPJrpQmdMAQo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>" 
      },
      acidente: {
        title: "Risco de Acidentes: Passagem e Porta",
        desc: "Possibilidade de tropeços e colisões devido ao fluxo de circulação entre carteiras e passagem da porta. Recomendação: Manter corredores desobstruídos.",
        video: "https://www.youtube.com/embed/dQw4w9WgXcQ" 
      }
    };

    function openModal(key) {
      const data = riskData[key];
      if (!data) return;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-desc').textContent = data.desc;
      document.getElementById('modal-video').src = data.video;
      document.getElementById('info-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('info-modal').style.display = 'none';
      document.getElementById('modal-video').src = ''; // Para o vídeo ao fechar
    }

    // Alternar entre 2D e 3D
    function switchView(view) {
      const view2D = document.getElementById('view-2d');
      const view3D = document.getElementById('view-3d');
      const btn2D = document.getElementById('btn-2d');
      const btn3D = document.getElementById('btn-3d');

      if (view === '2d') {
        view2D.style.display = 'flex';
        view3D.style.display = 'none';
        btn2D.classList.add('active');
        btn3D.classList.remove('active');
      } else {
        view2D.style.display = 'none';
        view3D.style.display = 'block';
        btn3D.classList.add('active');
        btn2D.classList.remove('active');

        if (!is3DInitialized) {
          init3D();
        } else {
          onWindowResize();
        }
      }
    }

    // Three.js (3D)
    let scene, camera, renderer, controls, raycaster, mouse;
    let is3DInitialized = false;
    let interactiveObjects = [];

    function init3D() {
      is3DInitialized = true;
      const container = document.getElementById('view-3d');
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 12, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Raycaster para cliques no 3D
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const loader = new THREE.GLTFLoader();
      loader.load('modelo_3d.glb', function (gltf) {
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        // Adicionar esferas de clique nos pontos de risco no 3D
        add3DMarker(new THREE.Vector3(2, 3, -2), 0x2eb85c, 'fisico');
        add3DMarker(new THREE.Vector3(0, 1, 0), 0xf9b115, 'ergonomico');
        add3DMarker(new THREE.Vector3(-2, 1, 3), 0x3399ff, 'acidente');

        loadingEl.style.display = 'none';
      });

      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onDocumentPointerDown);

      animate();
    }

    function add3DMarker(position, colorHex, riskKey) {
      const geometry = new THREE.SphereGeometry(0.35, 16, 16);
      const material = new THREE.MeshBasicMaterial({ color: colorHex });
      const sphere = new THREE.Mesh(geometry, material);
      sphere.position.copy(position);
      sphere.userData = { riskKey: riskKey };
      scene.add(sphere);
      interactiveObjects.push(sphere);
    }

    function onDocumentPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const key = intersects[0].object.userData.riskKey;
        if (key) openModal(key);
      }
    }

    function onWindowResize() {
      if (!is3DInitialized) return;
      const container = document.getElementById('view-3d');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }
  </script>
</body>
</html>
